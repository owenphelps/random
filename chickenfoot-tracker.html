<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Chickenfoot Score Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            text-align: center;
        }

        h1 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .setup-section, .game-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        .hidden {
            display: none !important;
        }

        .player-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"], input[type="number"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:active {
            background: #5568d3;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:active {
            background: #d0d0d0;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:active {
            background: #dc2626;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:active {
            background: #059669;
        }

        .btn-full {
            width: 100%;
            margin-top: 10px;
        }

        .player-list {
            list-style: none;
            margin-bottom: 15px;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f5f5f5;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .player-item button {
            padding: 6px 12px;
            font-size: 14px;
        }

        .score-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .score-table th {
            background: #667eea;
            color: white;
            padding: 10px 5px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .score-table td {
            padding: 8px 5px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .score-table tr:nth-child(even) {
            background: #f9f9f9;
        }

        .score-table .total-row {
            background: #667eea !important;
            color: white;
            font-weight: bold;
        }

        .score-table .total-row td {
            padding: 12px 5px;
        }

        .score-input {
            width: 60px;
            padding: 6px;
            text-align: center;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
        }

        .current-round {
            background: #fef3c7;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: 600;
            color: #92400e;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .controls button {
            flex: 1;
            min-width: 120px;
        }

        .winner-banner {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .best-score {
            background: #d1fae5 !important;
            font-weight: bold;
        }

        .worst-score {
            background: #fecaca !important;
            font-weight: bold;
        }

        .current-leader {
            background: #fef3c7 !important;
            font-weight: bold;
        }

        .last-place {
            background: #fecaca !important;
            font-weight: bold;
        }

        .leader-cell {
            font-size: 16px;
        }

        .score-table th.player-header {
            border-left: 2px solid #5568d3;
        }

        .score-table td.round-score {
            border-left: 2px solid #e0e0e0;
            font-size: 13px;
        }

        .score-table td.cumulative-total {
            font-weight: 600;
            font-size: 13px;
        }

        .score-table th.sub-header {
            background: #8b9ce8;
            font-size: 11px;
            padding: 5px 3px;
        }

        @media (max-width: 600px) {
            .score-table {
                font-size: 12px;
            }

            .score-input {
                width: 50px;
                font-size: 12px;
            }

            h1 {
                font-size: 20px;
            }

            button {
                font-size: 14px;
                padding: 10px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐔 Chickenfoot Score Tracker</h1>
        </header>

        <div id="setupSection" class="setup-section">
            <h2 style="margin-bottom: 15px; color: #667eea;">Setup Game</h2>
            <div class="player-input-group">
                <input type="text" id="playerNameInput" placeholder="Enter player name" />
                <button class="btn-primary" onclick="addPlayer()">Add Player</button>
            </div>
            <ul id="playerList" class="player-list"></ul>
            <button class="btn-success btn-full" onclick="startGame()">Start Game</button>
        </div>

        <div id="gameSection" class="game-section hidden">
            <div id="winnerBanner" class="winner-banner hidden"></div>
            <div class="current-round" id="currentRound">Round 1</div>

            <div style="overflow-x: auto;">
                <table class="score-table">
                    <thead id="scoreTableHead"></thead>
                    <tbody id="scoreTableBody"></tbody>
                    <tfoot id="scoreTableFoot"></tfoot>
                </table>
            </div>

            <div class="controls">
                <button class="btn-primary" onclick="addRound()">Add Round</button>
                <button class="btn-secondary" onclick="endGame()">End Game</button>
                <button class="btn-danger" onclick="newGame()">New Game</button>
            </div>
        </div>
    </div>

    <script>
        let players = [];
        let rounds = [];
        let currentRound = 0;
        let gameEnded = false;

        function loadGame() {
            const saved = localStorage.getItem('chickenfootGame');
            if (saved) {
                const data = JSON.parse(saved);
                players = data.players || [];
                rounds = data.rounds || [];
                currentRound = data.currentRound || 0;
                gameEnded = data.gameEnded || false;

                if (players.length > 0) {
                    document.getElementById('setupSection').classList.add('hidden');
                    document.getElementById('gameSection').classList.remove('hidden');
                    renderGame();
                }
            }
        }

        function saveGame() {
            localStorage.setItem('chickenfootGame', JSON.stringify({
                players,
                rounds,
                currentRound,
                gameEnded
            }));
        }

        function addPlayer() {
            const input = document.getElementById('playerNameInput');
            const name = input.value.trim();

            if (name && !players.includes(name)) {
                players.push(name);
                input.value = '';
                renderPlayerList();
            }
        }

        function removePlayer(name) {
            players = players.filter(p => p !== name);
            renderPlayerList();
        }

        function renderPlayerList() {
            const list = document.getElementById('playerList');
            list.innerHTML = '';
            players.forEach(name => {
                const li = document.createElement('li');
                li.className = 'player-item';
                
                const span = document.createElement('span');
                span.textContent = name;
                
                const button = document.createElement('button');
                button.className = 'btn-danger';
                button.textContent = 'Remove';
                button.addEventListener('click', () => removePlayer(name));
                
                li.appendChild(span);
                li.appendChild(button);
                list.appendChild(li);
            });
        }

        function startGame() {
            if (players.length < 2) {
                alert('Please add at least 2 players');
                return;
            }

            rounds = [players.reduce((acc, player) => ({ ...acc, [player]: 0 }), {})];
            currentRound = 0;
            gameEnded = false;

            document.getElementById('setupSection').classList.add('hidden');
            document.getElementById('gameSection').classList.remove('hidden');

            renderGame();
            saveGame();
        }

        function renderGame() {
            // Render table head with escaped player names
            const headRow1 = document.createElement('tr');
            const roundHeader = document.createElement('th');
            roundHeader.setAttribute('rowspan', '2');
            roundHeader.textContent = 'Round';
            headRow1.appendChild(roundHeader);
            
            players.forEach(p => {
                const th = document.createElement('th');
                th.setAttribute('colspan', '2');
                th.className = 'player-header';
                th.textContent = p;
                headRow1.appendChild(th);
            });
            
            const leaderHeader = document.createElement('th');
            leaderHeader.setAttribute('rowspan', '2');
            leaderHeader.textContent = 'Leader';
            headRow1.appendChild(leaderHeader);
            
            const headRow2 = document.createElement('tr');
            players.forEach(() => {
                const scoreHeader = document.createElement('th');
                scoreHeader.className = 'sub-header';
                scoreHeader.textContent = 'Score';
                headRow2.appendChild(scoreHeader);
                
                const totalHeader = document.createElement('th');
                totalHeader.className = 'sub-header';
                totalHeader.textContent = 'Total';
                headRow2.appendChild(totalHeader);
            });
            
            const thead = document.getElementById('scoreTableHead');
            thead.innerHTML = '';
            thead.appendChild(headRow1);
            thead.appendChild(headRow2);

            // Calculate cumulative totals after each round
            const cumulativeTotals = rounds.map((_, roundIdx) => {
                return players.reduce((totals, player) => {
                    totals[player] = rounds.slice(0, roundIdx + 1)
                        .reduce((sum, r) => sum + (r[player] || 0), 0);
                    return totals;
                }, {});
            });

            // Render table body with escaped player names
            const tbody = document.getElementById('scoreTableBody');
            tbody.innerHTML = '';
            
            rounds.forEach((round, idx) => {
                // Find best and worst scores in this round (lowest and highest)
                const roundScores = players.map(p => round[p] || 0);
                const bestRoundScore = Math.min(...roundScores);
                const worstRoundScore = Math.max(...roundScores);

                // Find leader and last place after this round
                const roundTotals = cumulativeTotals[idx];
                const leaderScore = Math.min(...Object.values(roundTotals));
                const lastPlaceScore = Math.max(...Object.values(roundTotals));
                const leaders = players.filter(p => roundTotals[p] === leaderScore);

                const tr = document.createElement('tr');
                
                // Round number cell
                const roundCell = document.createElement('td');
                const roundStrong = document.createElement('strong');
                roundStrong.textContent = `R${idx + 1}`;
                roundCell.appendChild(roundStrong);
                tr.appendChild(roundCell);
                
                // Player score cells
                players.forEach(player => {
                    const score = round[player] || 0;
                    const cumulative = roundTotals[player];

                    const isBestInRound = score === bestRoundScore && bestRoundScore !== worstRoundScore;
                    const isWorstInRound = score === worstRoundScore && bestRoundScore !== worstRoundScore;
                    const isLeaderInRound = cumulative === leaderScore;
                    const isLastPlace = cumulative === lastPlaceScore && cumulative > 0 && players.length > 1;

                    const scoreClass = isBestInRound ? 'best-score' : (isWorstInRound ? 'worst-score' : '');
                    const totalClass = isLeaderInRound ? 'current-leader' : (isLastPlace && cumulative !== leaderScore ? 'last-place' : '');

                    // Score input cell
                    const scoreCell = document.createElement('td');
                    scoreCell.className = `round-score ${scoreClass}`;
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.className = 'score-input';
                    input.value = score;
                    input.min = '0';
                    input.addEventListener('change', function() {
                        updateScore(idx, player, this.value);
                    });
                    input.addEventListener('focus', function() {
                        this.select();
                    });
                    scoreCell.appendChild(input);
                    tr.appendChild(scoreCell);

                    // Cumulative total cell
                    const totalCell = document.createElement('td');
                    totalCell.className = `cumulative-total ${totalClass}`;
                    totalCell.textContent = cumulative + (isLeaderInRound ? ' 👑' : '');
                    tr.appendChild(totalCell);
                });
                
                // Leader cell
                const leaderCell = document.createElement('td');
                leaderCell.className = 'leader-cell';
                if (leaders.length === 1) {
                    leaderCell.textContent = leaders[0];
                } else if (leaders.length > 1) {
                    leaderCell.textContent = 'Tie';
                }
                tr.appendChild(leaderCell);
                
                tbody.appendChild(tr);
            });

            const totals = calculateTotals();
            const currentLeaderScore = Math.min(...Object.values(totals));
            const currentLastPlaceScore = Math.max(...Object.values(totals));

            // Render table footer with escaped player names
            const tfoot = document.getElementById('scoreTableFoot');
            tfoot.innerHTML = '';
            
            const footerRow = document.createElement('tr');
            footerRow.className = 'total-row';
            
            const finalCell = document.createElement('td');
            finalCell.textContent = 'Final';
            footerRow.appendChild(finalCell);
            
            players.forEach(player => {
                const isLeader = totals[player] === currentLeaderScore;
                const isLastPlace = totals[player] === currentLastPlaceScore && totals[player] !== currentLeaderScore;
                
                const td = document.createElement('td');
                td.setAttribute('colspan', '2');
                td.className = isLeader ? 'current-leader' : (isLastPlace ? 'last-place' : '');
                td.textContent = totals[player] + (isLeader ? ' 👑' : '') + (isLastPlace ? ' ❌' : '');
                footerRow.appendChild(td);
            });
            
            const emptyCell = document.createElement('td');
            footerRow.appendChild(emptyCell);
            tfoot.appendChild(footerRow);

            document.getElementById('currentRound').textContent =
                gameEnded ? 'Game Ended' : `Round ${currentRound + 1}`;

            if (gameEnded) {
                const winnerScore = Math.min(...Object.values(totals));
                const winners = players.filter(p => totals[p] === winnerScore);

                const winnerBanner = document.getElementById('winnerBanner');
                if (winners.length === 1) {
                    winnerBanner.textContent = `🏆 ${winners[0]} Wins! (${winnerScore} points)`;
                } else {
                    winnerBanner.textContent = `🏆 Tie! ${winners.join(', ')} Win! (${winnerScore} points each)`;
                }
                winnerBanner.classList.remove('hidden');
            } else {
                document.getElementById('winnerBanner').classList.add('hidden');
            }
        }

        function updateScore(roundIdx, player, value) {
            rounds[roundIdx][player] = parseInt(value) || 0;
            saveGame();
            renderGame();
        }

        function calculateTotals() {
            return players.reduce((totals, player) => {
                totals[player] = rounds.reduce((sum, round) => sum + (round[player] || 0), 0);
                return totals;
            }, {});
        }

        function addRound() {
            if (gameEnded) {
                alert('Game has ended. Start a new game to continue.');
                return;
            }

            currentRound++;
            rounds.push(players.reduce((acc, player) => ({ ...acc, [player]: 0 }), {}));
            saveGame();
            renderGame();
        }

        function endGame() {
            if (confirm('Are you sure you want to end this game?')) {
                gameEnded = true;
                saveGame();
                renderGame();
            }
        }

        function newGame() {
            if (confirm('Start a new game? Current game will be cleared.')) {
                localStorage.removeItem('chickenfootGame');
                players = [];
                rounds = [];
                currentRound = 0;
                gameEnded = false;

                document.getElementById('setupSection').classList.remove('hidden');
                document.getElementById('gameSection').classList.add('hidden');
                renderPlayerList();
            }
        }

        document.getElementById('playerNameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addPlayer();
            }
        });

        loadGame();
    </script>
</body>
</html>
